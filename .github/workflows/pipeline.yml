name: Pipeline Diario ML

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pipeline-diario:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r pipeline/requirements.txt

      - name: Extraer datos de Odoo (ultimos 14 dias)
        env:
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_USER: ${{ secrets.ODOO_USER }}
          ODOO_PASSWORD: ${{ secrets.ODOO_PASSWORD }}
        run: |
          python pipeline/extraer_odoo.py
          echo "--- Archivos despues de extraccion ---"
          ls -la data/ || true

      - name: Consolidar historico
        run: |
          python pipeline/consolidar.py
          echo "--- Archivos despues de consolidar ---"
          ls -la data/ || true

      - name: Generar snapshots por hora de corte
        run: |
          python pipeline/generar_snapshots.py
          echo "--- Archivos despues de snapshots ---"
          ls -la data/ || true

      - name: Entrenar y evaluar modelos
        run: |
          python pipeline/entrenar.py
          echo "--- Archivos despues de entrenar ---"
          ls -la data/ models/ metrics/ || true

      - name: Guardar artefactos de respaldo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metricas-del-dia
          path: |
            metrics/metricas.csv
            models/*.pkl
            data/snapshots.csv
          if-no-files-found: ignore

      - name: Commit y push de datos, modelos y metricas
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data models metrics
          git diff --cached --quiet || git commit -m "[skip ci] pipeline diario $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
